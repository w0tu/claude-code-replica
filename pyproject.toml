[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-replica"
version = "2.1.0"
description = "A powerful open-source agentic CLI replica of Anthropic's Claude Code."
readme = "README.md"
authors = [{ name = "Claude Code Replica Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]

[project.scripts]
claude-replica = "claude_replica.cli:main"
claudereplica = "claude_replica.cli:main"
